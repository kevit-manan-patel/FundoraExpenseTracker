<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundora</title>
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('fundora-theme');
          const legacy = saved === null ? localStorage.getItem('fundora_theme') : null;
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (legacy === 'light' || legacy === 'dark') theme = legacy;
        } catch (error) {
          console.warn('Could not read the saved Fundora theme preference.', error);
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
